# Local development: the API plus Redis. The database is on Supabase.
# Start everything with:  docker compose up -d --build

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code # code changes apply without rebuilding
      - ./widget:/widget
    command: >-
      sh -c "alembic upgrade head || echo 'WARNING: database migrations failed' >&2;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s # time for replies and lead alerts to finish on redeploy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
